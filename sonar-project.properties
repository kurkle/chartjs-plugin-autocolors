sonar.projectKey=kurkle_chartjs-plugin-autocolors
sonar.organization=kurkle

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=chartjs-plugin-autocolors

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src/,.github/workflows
sonar.tests=test/


# actions/upload-artifact drops the leading directories of a *single* input
# path (there is nothing left to disambiguate once only one file matches),
# so the shared workflow's Sonar job downloads this as coverage/lcov.info,
# not coverage/browser/lcov.info. Verified against the actual artifact
# content of a real run rather than assumed from the action's docs.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The floating v1 tag is deliberate: it is how a fix in kurkle/configs reaches
# every repository without a pull request in each one. Pinning a commit SHA
# would defeat that mechanism.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/*.yml
