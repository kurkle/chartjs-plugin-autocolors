name: PR CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  shared-ci:
    uses: kurkle/configs/.github/workflows/shared-ci.yml@v1
    with:
      fetch-depth: 1
      install-command: npm clean-install --ignore-scripts && npx playwright install chromium firefox
      run-audit-signatures: false
      # Vitest browser mode replaced Karma, so the per-browser lcov split is gone.
      coverage-paths: |
        coverage/browser/lcov.info
      # Playwright's browsers are headless; the shared xvfb wrapper is not needed.
      browser-tests: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
